services:
  tanomar:
    build:
      context: .
      dockerfile: apps/api/TaNoMar.Api/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Defina GOOGLE_CLIENT_ID}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${ConnectionStrings__Default:?Defina ConnectionStrings__Default}
      TaNoMar__GoogleClientId: ${GOOGLE_CLIENT_ID:?Defina GOOGLE_CLIENT_ID}
      TaNoMar__JwtKey: ${JWT_KEY:?Defina JWT_KEY}
      TaNoMar__BootstrapAdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
      TaNoMar__BootstrapAdminGoogleSubject: ${BOOTSTRAP_ADMIN_GOOGLE_SUBJECT:-}
      TaNoMar__VapidPublicKey: ${VAPID_PUBLIC_KEY:-}
      TaNoMar__VapidPrivateKey: ${VAPID_PRIVATE_KEY:-}
      TaNoMar__VapidSubject: ${VAPID_SUBJECT:-}
      Fishing__TabuaMareApiKey: ${TABUA_MARE_API_KEY:-}
      Fishing__GeoapifyApiKey: ${GEOAPIFY_API_KEY:-}
      Fishing__OpenMeteoApiKey: ${OPEN_METEO_API_KEY:-}
      Fishing__OpenMeteoWeatherBaseUrl: ${OPEN_METEO_WEATHER_BASE_URL:-https://api.open-meteo.com/v1/forecast}
      Fishing__OpenMeteoGfsBaseUrl: ${OPEN_METEO_GFS_BASE_URL:-https://api.open-meteo.com/v1/gfs}
      Fishing__OpenMeteoMarineBaseUrl: ${OPEN_METEO_MARINE_BASE_URL:-https://marine-api.open-meteo.com/v1/marine}
      Fishing__CacheHours: ${Fishing__CacheHours:-6}
      Fishing__MaxStaleHours: ${Fishing__MaxStaleHours:-12}
      Fishing__RefreshBatchSize: ${Fishing__RefreshBatchSize:-10}
      Fishing__RefreshConcurrency: ${Fishing__RefreshConcurrency:-2}
      Fishing__RefreshQueueCapacity: ${Fishing__RefreshQueueCapacity:-256}
      Webcams__WindyApiKey: ${WINDY_WEBCAMS_API_KEY:-}
      Webcams__YouTubeApiKey: ${YOUTUBE_API_KEY:-}
      Webcams__SearchRadiusKm: ${Webcams__SearchRadiusKm:-10}
      Webcams__AvailabilityCacheMinutes: ${Webcams__AvailabilityCacheMinutes:-15}
      # A chave Asaas começa com $aact_. No Coolify cole sem o $ (aact_prod_...), senão o Compose esvazia o valor.
      Billing__AsaasApiKey: ${ASAAS_API_KEY:-}
      Billing__AsaasBaseUrl: ${ASAAS_BASE_URL:-https://api.asaas.com/v3}
      Billing__AsaasWebhookToken: ${ASAAS_WEBHOOK_TOKEN:-}
      Billing__PublicAppOrigin: ${PUBLIC_APP_ORIGIN:-}
      Resend__ApiKey: ${RESEND_API_KEY:-}
      Resend__FromEmail: ${RESEND_FROM_EMAIL:-}
      Resend__FromName: ${RESEND_FROM_NAME:-TáNoMar}
      Resend__NotificationEmail: ${RESEND_NOTIFICATION_EMAIL:-}
      WhatsApp__Enabled: ${WHATSAPP_ENABLED:-false}
      WhatsApp__BaseUrl: http://tanomar-whatsapp:3000
      WhatsApp__ApiKey: ${WHATSAPP_API_KEY:?Defina WHATSAPP_API_KEY}
    ports:
      - "${TANOMAR_BIND_ADDRESS:-127.0.0.1}:${TANOMAR_PORT:-8082}:8080"
    volumes:
      - tanomar-data:/var/lib/tanomar
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/api/health > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  tanomar-whatsapp:
    build:
      context: .
      dockerfile: services/tanomar-whatsapp/Dockerfile
    environment:
      PORT: 3000
      INTERNAL_API_KEY: ${WHATSAPP_API_KEY:?Defina WHATSAPP_API_KEY}
      SESSION_PATH: /data/session
      INSTANCE_NAME: ${WHATSAPP_INSTANCE_NAME:-TaNoMar}
    volumes:
      - tanomar-whatsapp-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  tanomar-data:
  tanomar-whatsapp-data:
