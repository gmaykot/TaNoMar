    <script id="landing-structured-data" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "TáNoMar",
        "description": "Compare as condições do mar, vento, ondas, maré e melhores horários para planejar sua pescaria com mais informação.",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Android, iOS, Windows, macOS, Linux",
        "url": "/",
        "image": "/icons/icon-1024.png"
      }
    </script>
    <script>
      (() => {
        const canonical = new URL('/', window.location.href);
        canonical.hostname = canonical.hostname.replace(/^www\./i, '');
        const image = new URL('/icons/icon-1024.png', canonical);
        document.getElementById('landing-canonical').href = canonical.href;
        document.getElementById('landing-og-url').content = canonical.href;
        document.getElementById('landing-og-image').content = image.href;
        document.getElementById('landing-twitter-image').content = image.href;
        const structuredData = document.getElementById('landing-structured-data');
        const data = JSON.parse(structuredData.textContent);
        data.url = canonical.href;
        data.image = image.href;
        structuredData.textContent = JSON.stringify(data);
      })();
    </script>
